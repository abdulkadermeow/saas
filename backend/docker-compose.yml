name: rafiq-backend

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rafiq}
      MYSQL_USER: ${DB_USERNAME:-rafiq}
      MYSQL_PASSWORD: ${DB_PASSWORD:-localtest123}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-localtest123}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  api:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    ports:
      - "8000:80"
    depends_on: [app]

  n8n:
    image: n8nio/n8n:latest
    container_name: rafiq-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=Asia/Amman
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=rafiq2026
      - N8N_SECRET=${N8N_SECRET:-change-me-in-env}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WEBHOOK_URL=https://multiply-alkaline-unfixed.ngrok-free.dev/
    volumes:
      - n8n_data:/home/node/.n8n

  waha:
    image: devlikeapro/waha
    container_name: waha
    ports:
      - "3333:3000"
    volumes:
      - ./waha_data:/app/.waha
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WHATSAPP_API_KEY=rafiq2026
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=rafiq2026
      - WHATSAPP_HOOK_URL=http://rafiq-n8n:5678/webhook-test/waha-webhook
      - WHATSAPP_HOOK_EVENTS=message.any
    restart: unless-stopped

volumes:
  db_data:
  n8n_data: