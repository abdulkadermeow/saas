name: rafiq-backend

# تشغيل الباك إند فقط (Laravel API + MySQL)
#   docker compose up -d --build
# الـ API بعدها على: http://localhost:8080/api

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rafiq}
      MYSQL_USER: ${DB_USERNAME:-rafiq}
      MYSQL_PASSWORD: ${DB_PASSWORD:-localtest123}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  api:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [app]

volumes:
  db_data:
